name: Build Samaa iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # 1. جلب كود المستودع بالكامل
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تحديد إصدار بيئة Xcode
      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # 3. اكتشاف المشروع تلقائياً وتجميع الكود
      - name: Build and Archive Project
        run: |
          # البحث التلقائي عن أي ملف .xcodeproj في المستودع
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.xcodeproj" -print -quit)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على أي ملف .xcodeproj في المستودع!"
            echo "قائمة الملفات الموجودة حالياً:"
            ls -R
            exit 1
          fi

          echo "✅ تم العثور على المشروع في: $PROJECT_FILE"

          # استخراج اسم أول Scheme متاح داخل المشروع تلقائياً
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_FILE" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | sed 's/^[ \t]*//' | head -n 1)
          
          if [ -z "$SCHEME_NAME" ]; then
            echo "❌ خطأ: لم يتم العثور على أي Scheme داخل المشروع!"
            exit 1
          fi

          echo "✅ سيتم البناء باستخدام الـ Scheme: $SCHEME_NAME"

          # تنفيذ عملية البناء والأرشفة مع تجاوز التوقيع
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS' \
            -archivePath build/Samaa.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      # 4. تحزيم الناتج في ملف تثبيت بصيغة .ipa
      - name: Package App into IPA
        run: |
          mkdir -p Payload
          # نسخ مجلد التطبيق المترجم (.app) داخل Payload
          cp -r build/Samaa.xcarchive/Products/Applications/*.app Payload/
          # ضغط المجلد بصيغة ipa
          zip -r Samaa.ipa Payload

      # 5. رفع الملف الناتج لخانة التحميل (Artifacts)
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samaa-iOS-IPA
          path: Samaa.ipa
          retention-days: 7
